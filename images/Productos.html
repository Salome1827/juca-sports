<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Catálogo - JUCA</title>

  <!-- ICONOS -->
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  />

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body{
      background:#f5f5f5;
    }

    /* NAVBAR */

    .navbar{
      width:100%;
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:25px 60px;
      background:white;
    }

    .logo{
      font-size:70px;
      font-weight:bold;
      line-height:60px;
      transform:rotate(90deg);
    }

    .nav-links{
      display:flex;
      gap:60px;
      align-items:center;
    }

    .nav-links a{
      text-decoration:none;
      color:black;
      font-size:18px;
    }

    .nav-links .active{
      color:#030303;
    }

    .icons{
      display:flex;
      gap:25px;
      font-size:24px;
      cursor:pointer;
    }

    /* CONTENIDO */

    .container{
      display:flex;
      padding:50px 70px;
      gap:80px;
    }

    /* SIDEBAR */

    .sidebar{
      width:320px;
    }

    .sidebar h1{
      margin-bottom:30px;
      font-size:48px;
    }

    .menu{
      background:#2d8f83;
      padding:30px;
      display:flex;
      flex-direction:column;
      gap:40px;
    }

    .menu-item{
      display:flex;
      justify-content:space-between;
      align-items:center;
      color:white;
      font-size:24px;
      cursor:pointer;
    }

    .menu-item a{
      color:white;
      text-decoration:none;
    }

    /* GALERIA */

    .gallery-section{
      flex:1;
    }

    .gallery-section h2{
      font-size:42px;
      margin-bottom:60px;
      font-weight:500;
    }

    .gallery{
      display:flex;
      gap:40px;
      align-items:flex-start;
      flex-wrap:wrap;
    }

    .card{
      width:260px;
      height:380px;
      overflow:hidden;
      background:white;
    }

    .card img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    /* RESPONSIVE */

    @media(max-width:1100px){

      .container{
        flex-direction:column;
      }

      .gallery{
        justify-content:center;
      }

      .sidebar{
        width:100%;
      }

    }

    @media(max-width:768px){

      .container{
        padding:30px 20px;
      }

      .gallery{
        gap:20px;
      }

      .menu{
        padding:20px;
        gap:30px;
      }

      .menu-item{
        font-size:20px;
      }

      .gallery-section h2{
        font-size:36px;
        margin-bottom:40px;
      }

      .nav-links{
        flex-wrap:wrap;
        justify-content:center;
        gap:20px;
      }
    }

    @media(max-width:576px){

      .navbar{
        flex-direction:column;
        align-items:flex-start;
        gap:15px;
        padding:20px;
      }

      .nav-links{
        width:100%;
        justify-content:center;
      }

      .sidebar{
        display:none;
      }

      .gallery-section{
        padding:0 10px;
      }

      .card{
        width:100%;
        height:auto;
      }

      .gallery{
        flex-direction:column;
        align-items:center;
      }
    }

  </style>
</head>

<body>

  <!-- NAVBAR -->

  <nav class="navbar">

    <div class="nav-links">
      <a href="Productos.html" class="active">Catalogo</a>
      <a href="NiñoYNiña.html">Niños y Niñas</a>
      <a href="Hombre.html">Hombre</a>
      <a href="Mujer.html">Mujer</a>
    </div>

    <div class="icons">
      <i class="fa-solid fa-magnifying-glass"></i>
      <i class="fa-regular fa-heart"></i>
    </div>

  </nav>

  <!-- CONTENIDO -->

  <section class="container">

    <!-- MENU IZQUIERDO -->

    <div class="sidebar">

      <h1>Catálogo</h1>

      <div class="menu">

        <div class="menu-item">
          <a href="Hombre.html">Hombres</a>
          <i class="fa-solid fa-chevron-right"></i>
        </div>

        <div class="menu-item">
          <a href="NiñoYNiña.html">Niños y Niñas</a>
          <i class="fa-solid fa-chevron-right"></i>
        </div>

        <div class="menu-item">
          <a href="Mujer.html">Mujeres</a>
          <i class="fa-solid fa-chevron-right"></i>
        </div>

      </div>

    </div>

    <!-- IMAGENES -->

    <div class="gallery-section">

      <h2>TIENDA</h2>

      <div class="gallery">

        <div class="card">
          <img src="hombre.jpg" alt="">
        </div>

        <div class="card">
          <img src="mujer.jpg" alt="">
        </div>

        <div class="card">
          <img src="niña.jpg" alt="">
        </div>

      </div>

    </div>

  </section>

</body>
</html>
