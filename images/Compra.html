<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Juca Mujer</title>

  <!-- BOOTSTRAP -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- ICONOS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>

  <style>

    body{
      background:#f5f5f5;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* NAVBAR */

    .top-navbar{
      background:#1f8a78;
      padding:25px;
    }

    .logo-box{
      width:130px;
      height:130px;
      background:white;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .logo-box img{
      width:90px;
      object-fit:contain;
    }

    .menu-link{
      color:white;
      text-decoration:none;
      font-size:18px;
      margin:0 20px;
      transition:.3s;
    }

    .menu-link:hover{
      opacity:.7;
    }

    .main-title{
      color:white;
      font-size:70px;
      font-weight:700;
      margin-left:30px;
    }

    /* PRODUCT SECTION */

    .product-section{
      padding:40px 20px;
      background:#f5f5f5;
    }

    .thumb-img{
      width:75px;
      height:115px;
      object-fit:cover;
      margin-bottom:15px;
      cursor:pointer;
      background:#ddd;
    }

    .main-product-img{
      width:100%;
      height:600px;
      object-fit:cover;
      background:#ddd;
    }

    .product-title{
      font-size:55px;
      font-weight:700;
    }

    .price{
      font-size:40px;
      font-weight:700;
    }

    .size-btn{
      border:2px solid #1f8a78;
      background:white;
      height:60px;
      border-radius:10px;
      font-size:25px;
      transition:.3s;
    }

    .size-btn:hover{
      background:#1f8a78;
      color:white;
    }

    .whatsapp-btn{
      background:#1f8a78;
      color:white;
      border:none;
      border-radius:40px;
      padding:18px 40px;
      font-size:25px;
      font-weight:600;
      transition:.3s;
      text-decoration:none;
      display:inline-block;
      text-align:center;
    }

    .whatsapp-btn:hover{
      background:#17695c;
      color:white;
    }

    .favorite-btn{
      border:2px solid #1f8a78;
      background:white;
      border-radius:40px;
      padding:15px 40px;
      font-size:22px;
      margin-top:20px;
      width:100%;
    }

    .small-preview{
      width:90px;
      height:120px;
      object-fit:cover;
      background:#ddd;
    }

    @media(max-width:991px){

      .main-title{
        font-size:45px;
      }

      .product-title{
        font-size:35px;
      }

      .price{
        font-size:30px;
      }

      .main-product-img{
        height:400px;
      }

    }

  </style>
</head>

<body>

  <!-- NAVBAR -->

  <div class="container-fluid top-navbar">

    <div class="row align-items-center">

      <!-- LOGO -->
      <div class="col-lg-2 d-flex align-items-center">

        <h1 class="main-title">MUJER</h1>

      </div>

      <!-- MENU -->
      <div class="col-lg-7 text-center">

        <a href="#" class="menu-link">Mujer</a>
        <a href="index.html" class="menu-link">LOGIN / REGISTER</a>

      </div>

  <!-- PRODUCT SECTION -->

  <div class="container-fluid product-section">

    <div class="row">

      <!-- MINI IMAGENES -->
      <div class="col-lg-1 d-flex flex-column align-items-center">

        <img src="tietop2.jpg" class="thumb-img" alt="">
        <img src="tietop3.jpg" class="thumb-img" alt="">

      </div>

      <!-- IMAGEN PRINCIPAL -->
      <div class="col-lg-4">

        <img src="tietop.jpg"
             class="main-product-img"
             alt="">

      </div>

      <!-- INFO PRODUCTO -->
      <div class="col-lg-5">

        <h2 class="product-title">JOMA</h2>

        <p class="fs-2">Tie Top para Mujer</p>

        <div class="price">$45</div>

        <p class="mt-3 text-muted fs-4">
          Precio incluido impuestos 
        </p>

        <!-- PREVIEW -->
        <img src="tietop.jpg"
             class="small-preview mt-2"
             alt="">

        <!-- TALLAS -->
        <div class="container-fluid p-0 mt-5">

          <div class="row g-3">

            <div class="col-6">
              <button class="btn w-100 size-btn">XS</button>
            </div>

            <div class="col-6">
              <button class="btn w-100 size-btn">S</button>
            </div>

            <div class="col-6">
              <button class="btn w-100 size-btn">M</button>
            </div>

            <div class="col-6">
              <button class="btn w-100 size-btn">L</button>
            </div>

            <div class="col-6">
              <button class="btn w-100 size-btn">XL</button>
            </div>

          </div>

        </div>

      </div>

      <!-- BOTONES -->
      <div class="col-lg-2 d-flex flex-column align-items-center">

        <!-- WHATSAPP REAL -->
        <a
          href="https://wa.me/593958926006text=Hola%20quiero%20comprar%20el%20Top%20Deportivo%20Joma"
          target="_blank"
          class="whatsapp-btn mt-5"
        >
          Comprar por<br>WHATSAPP
        </a>

        <button class="favorite-btn">
          Favorito
          <i class="fa-regular fa-heart ms-2"></i>
        </button>

      </div>

    </div>

  </div>

  <!-- BOOTSTRAP JS -->

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
