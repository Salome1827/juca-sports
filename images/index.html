<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>JUCA</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- NAVBAR -->
  <header class="navbar">
    <div class="logo">JUCA</div>

    <nav class="nav-links">
      <button onclick="window.location.href='Productos.html'">Catalogo</button>
      <a href="#">Locales</a>
      <button onclick="window.location.href='Productos.html'">Hombre</button>
      <button onclick="window.location.href='Productos.html'">Mujer</button>
    </nav>

    <div class="login">
      LOGIN / REGISTER
    </div>
  </header>

  <!-- HERO -->
  <section class="hero">
    <img src="principal2.jpg" alt="Hero Image">
  </section>

    <div class="card">
      <img src="zapatos.jpg" alt="Zapatos">
      <button class="shop-btn" onclick="window.location.href='Productos.html'">SHOP</button>
      <div class="card-title">ZAPATOS</div>
    </div>
  </section>

  <!-- PRODUCTOS -->
  <section class="products">
    <div class="product-card">
      <img src="primera.jpg" alt="Primera">
      <button class="green-btn" onclick="window.location.href='Productos.html'">SHOP</button>
    </div>

    <div class="product-card">
      <img src="segunda.jpg" alt="Segunda">
      <button class="green-btn" onclick="window.location.href='Productos.html'">SHOP</button>
    </div>

    <div class="product-card">
      <img src="tercera.jpg" alt="Tercera">
      <button class="green-btn" onclick="window.location.href='Productos.html'">SHOP</button>
    </div>
  </section>

</body>
</html>
