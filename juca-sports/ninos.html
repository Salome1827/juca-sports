<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <title>NIÑOS | JUCA</title>

    <style>

        body{
            background-color: #efefef;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* NAVBAR */

        .top-bar{
            background-color: #1f8f80;
            padding: 25px 40px;
        }

        .logo-box{
            width: 120px;
            height: 120px;
            background: white;
        }

        .titulo{
            color: white;
            font-size: 70px;
            font-weight: bold;
        }

        .nav-links a{
            text-decoration: none;
            color: white;
            margin-left: 40px;
            font-size: 20px;
            transition: 0.3s;
        }

        .nav-links a:hover{
            opacity: 0.7;
        }

        .icon-box{
            width: 55px;
            height: 55px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: 10px;
            cursor: pointer;
        }

        /* PRODUCTOS */

        .products{
            padding: 50px 20px;
        }

        .product-card{
            text-align: center;
        }

        .product-card img{
            width: 100%;
            height: 320px;
            object-fit: cover;
            background-color: #ddd;
        }

        .product-title{
            font-size: 20px;
            margin-top: 15px;
            line-height: 1.2;
        }

        .price{
            font-size: 20px;
        }

        /* CATEGORIAS */

        .category-section{
            padding: 30px 20px 60px;
        }

        .category-card{
            position: relative;
            overflow: hidden;
        }

        .category-card img{
            width: 100%;
            height: 550px;
            object-fit: cover;
            background-color: #d9d9d9;
        }

        .category-btn{
            position: absolute;
            bottom: 35px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            border: none;
            padding: 18px 45px;
            border-radius: 40px;
            font-size: 22px;
            font-weight: bold;
            transition: 0.3s;
        }

        .category-btn:hover{
            transform: translateX(-50%) scale(1.05);
        }

        /* RESPONSIVE */

        @media(max-width:991px){

            .titulo{
                font-size: 45px;
            }

            .nav-links{
                margin-top: 20px;
            }

            .nav-links a{
                margin-left: 15px;
                font-size: 16px;
            }

            .category-card img{
                height: 400px;
            }

        }

    </style>

</head>
<body>


<!-- NAVBAR -->
<div class="container-fluid top-bar">

    <div class="d-flex justify-content-between align-items-center flex-wrap">

        <!-- IZQUIERDA -->
        <div class="d-flex align-items-center">

            <!-- LOGO PLACEHOLDER -->


            <h1 class="titulo ms-4">NIÑO Y NIÑA</h1>

        </div>

        <!-- DERECHA -->
        <div class="d-flex align-items-center flex-wrap">

            <div class="nav-links d-flex align-items-center">

                <a href="productos.html" class="active">Catalogo</a>
                <a href="productos.html">LOCALES</a>
                <a href="productos.html">Hombre</a>
                <a href="productos.html">Mujer</a>
            </div>
                </div>
    
                </div>

            </div>

        </div>

    </div>

</div>


<!-- PRODUCTOS -->
<div class="container-fluid products">

    <div class="row g-4">

        <!-- PRODUCTO -->
        <div class="col-lg-2 col-md-4 col-6">

            <div class="product-card">

                <a href="compra-ninos.html"><img src="images/camisetan.jpg" alt=""></a>

                <div class="product-title">
                    Camiseta
                </div>

                <div class="price">
                    $30
                </div>

            </div>

        </div>

<!-- CATEGORIAS -->
<div class="container-fluid category-section">

    <div class="row g-0">

        <!-- CARD -->
        <div class="col-lg-4">

            <div class="category-card">

                <img src="images/accesorion.jpg" alt="">

                <button class="category-btn">
                    ZAPATOS
                </button>

            </div>

        </div>

        <!-- CARD -->
        <div class="col-lg-4">

            <div class="category-card">

                <img src="images/vendidon.jpg" alt="">

                <button class="category-btn">
                    MAS VENDIDOS
                </button>

            </div>

        </div>

        <!-- CARD -->
        <div class="col-lg-4">

            <div class="category-card">

                <img src="images/shortfaldan.jpg" alt="">

                <button class="category-btn">
                    SHORTS Y FALDAS
                </button>

            </div>

        </div>

    </div>

</div>



<!-- JAVASCRIPT -->
<script>

    // EFECTO SIMPLE EN LOS BOTONES

    const buttons = document.querySelectorAll(".category-btn");

    buttons.forEach(button => {

        button.addEventListener("mouseenter", () => {

            button.style.background = "#1f8f80";
            button.style.color = "white";

        });

        button.addEventListener("mouseleave", () => {

            button.style.background = "white";
            button.style.color = "black";

        });

    });

</script>


</body>
</html>
